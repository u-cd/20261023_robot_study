[project]
name = "robot-act-runpod"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1", "torchvision==0.20.1",
  "numpy==2.5.4", "opencv-python==4.14.0.94", "matplotlib==3.11.2",
  "h5py==3.16.0", "einops==0.8.2", "ipython==9.18.1", "tqdm==4.70.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
