[project]
name = "robot-study"
version = "0.1.0"
description = "Fixed-camera sponge detection and control of an Adeept robot arm"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyserial==3.5",
    "numpy==2.5.4",
    "opencv-python==4.14.0.94",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.3.228",
    "faster-coco-eval==1.8.0",
    "PyYAML==6.0.3",
    "tensorboard==2.21.0",
    "calflops==0.3.2",
    "transformers==4.51.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
